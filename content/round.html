---
title: Tournée
slug: round
layout: app
---
<Suspense>
    <template #default>
        <round></round>
    </template>
    <template #fallback>
        <article class="mb-5 placeholder-glow">
            <div class="round-header">
                <div class="round-motto">
                    <div class="icon">🍻</div>
                    <p class="title">Ta tournée t'attend</p>
                    <p class="motto">Partage et scanne pour rejoindre la tournée !</p>
                </div>
                <div class="round-title">
                    <p class="round-label">
                        <i class="bi bi-upc-scan me-1" aria-hidden="true"></i>
                        Nom de la tournée
                    </p>
                    <h2 class="round-cartouche placeholder text-secondary"></h2>
                </div>
                <div class="round-time">
                    <p class="round-label">
                        <i class="bi bi-clock me-1" aria-hidden="true"></i>
                        On se retrouve
                    </p>
                    <div class="round-cartouche placeholder text-secondary"></div>
                </div>
                <div class="round-qrcode">
                    <div class="qrcode placeholder text-secondary"></div>
                </div> 
            </div>
            <h3 class="h1 mt-2 mb-3 placeholder text-secondary col-5"></h3>
            <ul class="card border border-light p-3 ps-4 pb-2 list-unstyled mb-3 placeholder text-secondary col-12">
                <li class="d-flex justify-content-between align-items-center mb-2">
                    <span class="me-2 py-2">0×</span>
                    <span class="col-3 me-auto">Name</span>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="avatar text-dark me-2"><i class="bi bi-people"></i></span>
                <p class="me-auto mb-0 placeholder text-secondary">
                    <span class="d-none d-md-inline">Total :</span> <span>0 consommation</span> <span>pour 0 assoifé</span>
                </p>
                <button class="btn btn-primary text-nowrap" disabled>
                    <i class="bi bi-search me-1" aria-hidden="true"></i>
                    Voir le détail de la commande
                </button>
            </div>
        </article>
    </template>
</Suspense>
